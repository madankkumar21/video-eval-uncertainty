[project]
name = "video-eval-uncertainty"
version = "0.1.0"
license = { text = "MIT" }
description = "Error bars on video benchmarks: a durable evaluation pipeline with a plain-Python core and thin adapters for Temporal, Prefect and Restate."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "av>=13",
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "huggingface_hub>=0.25",
    "remotezip>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.7"]
prefect = ["prefect>=3.0"]
restate = ["restate_sdk[serde]>=0.5", "hypercorn>=0.17"]
mcp = ["fastmcp>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
